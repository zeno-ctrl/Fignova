name: tests
on:
  push:
  pull_request:
jobs:
  full:
    name: Full engine (LibreOffice, SQLite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  vercel-mode:
    name: Vercel mode (Postgres, no renderer, no OCR)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: afs }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afs
      AUTOFIGURE_LITE: "1"
      AUTOFIGURE_STORAGE: database
      AUTOFIGURE_DISABLE_OCR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest==9.1.1 httpx2==2.13.1
      - run: python -m pytest -q tests/test_lite.py tests/test_extras.py tests/test_numbering.py tests/test_validation.py
