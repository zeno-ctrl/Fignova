{% extends "base.html" %}
{% block header %}{% endblock %}{% block footer %}{% endblock %}
{% block head %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block main %}
<div class="auth-wrap">
  <div class="card card-lg auth-card stack" id="enroll" style="--gap:14px;width:min(520px,100%)">
    <div class="row" style="gap:10px"><img src="/static/img/logo.svg" width="40" height="40" alt=""><div><b>AutoFigure Studio</b><div class="xs muted">Owner enrollment</div></div></div>
    <h1 style="font-size:1.6rem;margin:6px 0 0">Set up owner access</h1>
    <div id="enroll-body"><p class="small muted">Checking your one-time invitation…</p></div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/owner-auth.js?v={{ version }}" defer></script>{% endblock %}
