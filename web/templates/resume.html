{% extends "base.html" %}
{% block header %}{% include "partials/app_header.html" %}{% endblock %}
{% block main %}
<section class="container" style="max-width:560px;padding:72px 0">

    <div class="proc-icon" style="margin:0 auto 16px" aria-hidden="true"><svg class="icon"><use href="#i-file"/></svg></div>

{% endblock %}
{% block scripts %}<script src="/static/js/resume.js?v={{ version }}" defer></script>{% endblock %}
