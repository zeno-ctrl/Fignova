# Local / single-host deployment: web app + isolated worker sharing one private data volume.
services:
  web:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["afs-data:/data"]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "autofigure", "worker"]
    volumes: ["afs-data:/data"]
    restart: unless-stopped
    # document rendering never needs the network; AI calls do — split into two workers if you
    # want the renderer on an internal-only network.
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
volumes:
  afs-data: {}
