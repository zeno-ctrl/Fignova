# Sample reverse proxy (TLS termination + request size limit)
server {
  listen 443 ssl http2;
  server_name autofigure.example.com;
  ssl_certificate     /etc/letsencrypt/live/autofigure.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/autofigure.example.com/privkey.pem;
  client_max_body_size 52m;            # keep in step with AUTOFIGURE_MAX_UPLOAD_MB
  proxy_read_timeout 120s;
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}
server { listen 80; server_name autofigure.example.com; return 301 https://$host$request_uri; }
